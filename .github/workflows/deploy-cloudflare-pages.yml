name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy pulado. Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos segredos do repositório."
          fi

      - name: Prepare public site files
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p cloudflare-pages-output
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.wrangler/' \
            --exclude='node_modules/' \
            --exclude='cloudflare-pages-output/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='assets/LEIA-ME.md' \
            ./ cloudflare-pages-output/
          test -f cloudflare-pages-output/index.html

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-pages-output --project-name=vivian-batistela --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
